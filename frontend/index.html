<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Forum</title>
    <link rel="stylesheet" href="./src/static/styles/main.css">
    <link rel="icon" href="./src/static/imgs/icons/books.ico" type="image/x-icon">
  </head>
  <body>
    <header class="header log-out">
        <a href="index.html" class="logo" aria-label="logo of forum"></a>
        <div class="header-btn"></div>
    </header>
    <main class="main">
         <section class="sidebar">
            <nav class="nav">
                <h2 class="nav_title">MENU</h2>
                <ul class="nav-list">
                    <li class="choosed"><a class="nav-list_item" href="#">Posts</a></li>
                    <li><a class="nav-list_item" href="users.html">Users</a></li>
                </ul>
            </nav>
         </section>
         <section class="main-section">
            <article class="tags">
                <button class="tags_item choosed">New</button>
                <button class="tags_item">Popular</button>
                <button class="tags_item">Most comments</button>
                <select name="category" class="tags_item" >
                    <option value="">Filter by category</option>
                    <option value="your option">Your option</option>
                </select>
            </article>
            <article class="posts">
                <a href="postInside.html?id=1" aria-label="link to the post" class="post">
                    <div class="author">
                        <div class="image-container">
                            <img class="author_img" src="./src/static/imgs/photo.jpeg" alt="photo of user">
                        </div>
                        <div class="author-info">
                            <p class="username">PolinaTheBest</p>
                            <p class="date">2026.09.27</p>
                        </div>
                    </div>
                    <h3 class="post_title">Help me find good book!</h3>
                    <div class="post-footer">
                        <div class="tags">
                            <div class="tags_item">book</div>
                            <div class="tags_item">new</div>
                            <div class="tags_item">recommend</div>
                        </div>
                        <div class="stats">
                            <p class="post_comments">20</p>
                            <p class="post_likes">14</p>
                        </div>
                    </div>
                </a>
                <a href="postInside.html?id=2" aria-label="link to the post" class="post">
                    <div class="author">
                        <div class="image-container">
                            <img class="author_img" src="./src/static/imgs/photo.jpeg" alt="photo of user">
                        </div>
                        <div class="author-info">
                            <p class="username">PolinaTheBest</p>
                            <p class="date">2026.09.27</p>
                        </div>
                    </div>
                    <h3 class="post_title">Help me find good book!</h3>
                    <div class="post-footer">
                        <div class="tags">
                            <div class="tags_item">book</div>
                            <div class="tags_item">new</div>
                            <div class="tags_item">recommend</div>
                        </div>
                        <div class="stats">
                            <p class="post_comments">20</p>
                            <p class="post_likes">14</p>
                        </div>
                    </div>
                </a>
            </article>
         </section>
    </main>
    <script type="module" src="/src/static/scripts/header.js"></script>
  </body>
</html>
