<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Forum</title>
    <link rel="stylesheet" href="./src/static/styles/main.css">
    <link rel="stylesheet" href="./src/static/styles/login.css">
    <link rel="icon" href="./src/static/imgs/icons/books.ico" type="image/x-icon">
  </head>
  <body>
    <header class="header">
        <img class="logo" src="./src/static/imgs/logo.png" alt="logo of forum">
        <div class="header-btn"></div>
    </header>
    <main class="main">
         <section class="sidebar">
            <nav class="nav">
                <h2 class="nav_title">MENU</h2>
                <ul class="nav-list">
                    <li><a class="nav-list_item" href="index.html">Posts</a></li>
                    <li class="choosed"><a class="nav-list_item" href="createPost.html">Create a post</a></li>
                    <li><a class="nav-list_item" href="users.html">Users</a></li>
                </ul>
            </nav>
         </section>
         <section class="create-post">
            <form class="newPost">
                <select name="" class="input" required>
                    <option value="">Choose the category</option>
                    <option value="your option">Your option</option>
                </select>
                <input class="input" type="text" placeholder="Write a title" required>
                <textarea class="input" placeholder="Write description" required></textarea>
                <div class="btn-container">
                    <button class="main_btn" disabled>Publish</button>
                </div>
            </form>
         </section>
    </main>
    <script type="module" src="/src/static/scripts/header.js"></script>
    <script type="module" src="/src/static/scripts/postHandling.js"></script>
  </body>
</html>
