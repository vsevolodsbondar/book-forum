<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Forum</title>
    <link rel="stylesheet" href="./src/static/styles/main.css" />
    <link
      rel="icon"
      href="./src/static/imgs/icons/books.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo" aria-label="logo of forum"></a>
      <div class="header-btn"></div>
    </header>
    <main class="main">
      <section class="sidebar">
        <nav class="nav">
          <h2 class="nav_title">MENU</h2>
          <ul class="nav-list">
            <li><a class="nav-list_item" href="index.html">Posts</a></li>
            <li><a class="nav-list_item" href="users.html">Users</a></li>
          </ul>
        </nav>
      </section>
      <section class="create-post">
        <form class="newPost" id="create_post">
          <select name="category" class="input" required>
            <option value="">Choose the category</option>
          </select>
          <input
            class="input"
            type="text"
            placeholder="Write a title"
            name="title"
            required
          />
          <textarea
            class="input"
            placeholder="Write description"
            required
            name="description"
          ></textarea>
          <p class="form_error" role="alert"></p>
          <div class="btn-container">
            <button type="submit" class="main_btn publish">Publish</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/src/static/scripts/header.js"></script>
    <script type="module" src="/src/static/scripts/createPost.js"></script>
  </body>
</html>
