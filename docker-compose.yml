services:

  frontend:
    container_name: literary_front
    build:
      context: ./forum_frontend
    ports:
      - "3000:80"
    networks:
      - forum_project
    depends_on:
      - backend

  backend:
    container_name: literary_back
    build:
      context: ./forum_backend
    ports:
      - "8080:8080"
    networks:
      - forum_project

  auth_service:
    container_name: literary_auth
    build:
      context: ./auth_service
    ports:
      - "8081:8080"
    networks:
      - forum_project

networks:
  forum_project:
    name: forum_project
